server:
  port: 8080
  context-path: /SpringBootRestApi

spring:
  jpa:
    show-sql: true
    generate-ddl: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  datasource:
    platform: postgres
    url: jdbc:postgresql://localhost:5432/erp_tugas
    username: "postgres"
    password: "090703"
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

multipart:
  enabled: true
  file-size-threshold: 2KB
  max-file-size: 200MB
  max-request-size: 215MB

file:
  upload-dir: /home/user/a/uploads